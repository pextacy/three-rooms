# Compiling the contract OUTSIDE the simulator.
#
# The interface is vendored beside the game (see contracts/ICasinoGameV2.sol), so
# `./ICasinoGameV2.sol` resolves here and in the SDK's watch folder alike. No
# remapping, no path that points outside the repository.
#
# Settings match the simulator's own solc invocation (viaIR, optimizer 200), so
# what is audited here is what runs there.
[profile.default]
src = "contracts"
out = "contracts/out"
libs = []
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true

[fmt]
line_length = 110
