<!doctype html>
<html lang="en" data-room="floor">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>THE BROKERS</title>
    <meta
      name="description"
      content="You hold a claim on a wreck. Every man who looks at it charges you. When have you shopped it enough?"
    />
    <!--
      An inline SVG favicon: a broker's page with a price pinned to it, in the
      four inks. Inline rather than a file, so the page makes no extra request,
      never 404s in a console a judge has open, and the "no image over 8 KB"
      gate stays trivially true.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%230c0a07%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%224%22%20width%3D%2222%22%20height%3D%2224%22%20fill%3D%22%23f6e6c4%22%20opacity%3D%22.14%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%229%22%20width%3D%2216%22%20height%3D%221.6%22%20fill%3D%22%23f6e6c4%22%20opacity%3D%22.55%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2214%22%20width%3D%2211%22%20height%3D%221.6%22%20fill%3D%22%23f6e6c4%22%20opacity%3D%22.4%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2219%22%20width%3D%2214%22%20height%3D%221.6%22%20fill%3D%22%23e0b463%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%225.5%22%20r%3D%222%22%20fill%3D%22%238d3a30%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="preload" href="/fonts/caslon-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#100e0c" />

    <!-- How the entry appears when its URL is pasted into a gallery or a chat. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="THE BROKERS" />
    <meta
      property="og:description"
      content="Pandora's Box, dealt at Lloyd's: every price you are named stays on the table, and every man who names one charges you."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      Chain Jam Vol. 1 entry widget. EXACTLY ONE of these, in the RAW HTML —
      never injected by JS, because the gallery reads the served document
      (claude.md I9, docs.md §5.2). scripts/gates.mjs greps for it.
    -->
    <script async src="https://jam.chain.wtf/widget.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/games/brokers/app/main.tsx"></script>
  </body>
</html>
