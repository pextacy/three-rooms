<!doctype html>
<html lang="en" data-room="roads">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>THE SURVEY</title>
    <meta
      name="description"
      content="A ship lies in the roads. Every surveyor you send costs you. When have you seen enough?"
    />
    <!--
      An inline SVG favicon: a ship under sail in the four inks. Inline rather
      than a file, so the page makes no extra request, never 404s in a console a
      judge has open, and the "no image over 8 KB" gate stays trivially true.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%230c0a07%22%2F%3E%3Cpath%20d%3D%22M15.4%204h1.2v17h-1.2z%22%20fill%3D%22%238d3a30%22%2F%3E%3Cpath%20d%3D%22M16.8%205.5%2024%2020h-7.2z%22%20fill%3D%22%23f6e6c4%22%2F%3E%3Cpath%20d%3D%22M15.2%208.5%209.5%2020h5.7z%22%20fill%3D%22%23f6e6c4%22%20opacity%3D%22.62%22%2F%3E%3Cpath%20d%3D%22M4%2021h24l-3.2%205.5H7.2z%22%20fill%3D%22%23e0b463%22%2F%3E%3Cpath%20d%3D%22M2%2029h28%22%20stroke%3D%22%23f6e6c4%22%20stroke-opacity%3D%22.28%22%20stroke-width%3D%221%22%2F%3E%3C%2Fsvg%3E" />
    <!-- Both faces the first frame needs: the words, and every live figure. -->
    <link rel="preload" href="/fonts/newsreader-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#070b10" />

    <!-- How the entry appears when its URL is pasted into a gallery or a chat. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="THE SURVEY" />
    <meta
      property="og:description"
      content="A ship lies in the roads. Every surveyor you send costs you. When have you seen enough?"
    />
    <meta name="twitter:card" content="summary" />

    <!--
      Chain Jam Vol. 1 entry widget. EXACTLY ONE of these, in the RAW HTML —
      never injected by JS, because the gallery reads the served document
      (claude.md I9, docs.md §5.2). scripts/gates.mjs greps for it.
    -->
    <script async src="https://jam.chain.wtf/widget.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/games/survey/app/main.tsx"></script>
  </body>
</html>
