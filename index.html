<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chain Jam — the games</title>
    <meta
      name="description"
      content="Wagering games built on decision primitives that do not exist anywhere in the casino industry."
    />
    <link rel="icon" href="/candle-icon.svg" />
    <!--
      The text face only. The figure face is NOT preloaded on purpose: its
      fallback is the system monospace, which carries the same 600/1000 advance
      (measured in Chrome: 240.0px against 240.8px for the same string), so the
      swap changes the glyphs and moves nothing. Newsreader has no such
      stand-in — Georgia is a different width — so it keeps the hint, and the
      critical path keeps a request it can spend on something that shifts.
    -->
    <link rel="preload" href="/fonts/newsreader-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#0c0a07" />

    <!--
      The jam widget belongs on the GAME pages, which are the entries. This is a
      lobby: it is not submitted, it reports no engagement, and it exists only so
      one URL can show everything.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/lobby/main.tsx"></script>
  </body>
</html>
