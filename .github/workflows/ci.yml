name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The SDK is downloaded, not vendored; the build aliases its guest source.
      - name: restore the SDK
        run: npm run sdk:fetch && npm run sdk:install

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # Phase 1 onwards: recomputes the DP from the paytable, never reads a constant.
      - name: verify:rtp
        run: npm run verify:rtp
        continue-on-error: true # until phase 1 lands the DP

      - name: build
        run: npm run build

      # README.md and DEMO.md are generated from the DP and from captured runs.
      # Regenerating and diffing is what stops a published number going stale.
      - name: generated docs are current
        run: |
          npm run gen:constants
          npm run gen:readme
          git diff --exit-code -- README.md contracts/generated/ \
            || (echo "::error::generated files are stale — run npm run gen:readme && npm run gen:constants" && exit 1)

      - name: gates
        run: npm run gates

      - name: embeddable
        run: npm run gates:iframe

      - name: frame budget
        run: npm run frame-budget

      - name: cold open
        run: npm run cold-open

  # I8 is the trap that silently costs the gallery preview, so the live origin is
  # re-read after every deploy rather than trusted from vercel.json.
  live-origin:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_ORIGIN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: re-read the live origin
        run: npm run gates -- --headers-only --origin "${{ vars.PRODUCTION_ORIGIN }}"
