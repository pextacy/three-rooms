name: ci

on:
  push:
  pull_request:

# A superseded run tells you nothing and costs a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no chain. Fast, and the first thing to go red.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall restores the SDK, which the build aliases rather than
      # reimplementing.
      - run: npm ci

      # And then re-fetches it, unconditionally. The SDK is downloaded from
      # sdk.chain.wtf with no version pin, and `fetch-sdk.mjs` skips the
      # download whenever sdk/ is already there — so a warm checkout keeps
      # whatever it first got while the Vercel build container starts empty and
      # takes the current one every time. That gap shipped a real bug once:
      # `computeMaxWager` changed shape on 2026-09-17 and the deployed build
      # stopped enforcing the wager ceiling. CI tests what deploys.
      - name: the SDK the deploy will actually use
        run: npm run sdk:fetch -- --force

      # The SDK has dependencies of its own — penpal and zod, declared in its own
      # package.json — and `npm ci` above installs this project's, not its. Only
      # one thing here reaches them: test/sdk-contract.spec.ts imports the SDK's
      # manifest.ts, which imports zod. Without this the suite dies on
      # ERR_MODULE_NOT_FOUND, while passing locally for anyone who has ever run
      # sdk:install by hand. The contract job below has always had this step;
      # this job never did, and nothing noticed until CI ran for the first time.
      - name: install the SDK workspaces
        run: npm run sdk:install

      - name: typecheck
        run: npm run typecheck

      # The declared RTP, recomputed from the paytable. NOT continue-on-error:
      # a silent pass here is the one failure that would reach a judge intact.
      - name: verify:rtp
        run: npm run verify:rtp

      # The second entry's declared RTP, recomputed from its own manifest. Same
      # standard, and the same reason: it is the number a judge will check.
      - name: verify:survey
        run: npm run verify:survey

      # The third entry: the market, the index, and the proof that Pandora's rule
      # is the dynamic program at every reachable state.
      - name: verify:brokers
        run: npm run verify:brokers

      - name: verify:light
        run: npm run verify:light

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # README.md, the site's documents and the Solidity constants are all
      # generated. A stale one is a published number that no longer matches the
      # code.
      - name: generated files are current
        run: |
          npm run gen:constants
          npm run gen:survey
          npm run gen:brokers
          npm run gen:pages
          npm run gen:readme
          git diff --exit-code -- README.md contracts/generated/ public/ \
            || { echo "::error::a generated file is stale — run npm run gen:constants gen:survey gen:brokers gen:pages gen:readme"; exit 1; }

      - name: gates
        run: npm run gates

      - name: embeddable
        run: npm run gates:iframe

      - name: frame budget
        run: npm run frame-budget

      - name: cold open
        run: npm run cold-open

  # The contract, against a real chain and a real VRF node. Slower, and the only
  # place parity, caps and the adversarial suite actually RUN rather than skip.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1

      - run: npm ci

      - name: the SDK the deploy will actually use
        run: npm run sdk:fetch -- --force

      # Compiles with the same settings the simulator uses, so what CI checks is
      # what the simulator deploys.
      - name: build the contract
        run: npm run contracts:build

      - name: install the SDK workspaces
        run: npm run sdk:install

      - name: start the local chain, the VRF node and the casino
        run: npm run sdk:stack &

      - name: wait for the chain
        run: |
          for i in $(seq 1 90); do
            curl -s -o /dev/null http://127.0.0.1:8545 && exit 0
            sleep 2
          done
          echo "::error::the local chain never came up"; exit 1

      - name: deploy all three contracts into the simulator
        run: |
          npm run sync:simulator
          for i in $(seq 1 45); do
            if grep -q CandleGame sdk/casino-sdk/simulator/local-node/deployed.json \
              && grep -q SurveyGame sdk/casino-sdk/simulator/local-node/deployed.json \
              && grep -q BrokersGame sdk/casino-sdk/simulator/local-node/deployed.json; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::one of the game contracts never deployed"; exit 1

      # parity, caps, adversarial, survey-parity and brokers-parity now run
      # instead of skipping.
      - name: test against the chain
        run: npm test

      - name: a real round settles
        run: npm run round-trip

      # And a real voyage, which also checks on chain that the word deciding the
      # ship arrives only after the call was submitted.
      - name: a real voyage settles
        run: npm run round-trip:survey

      # And a real claim, which also checks on chain that a broker's price is
      # drawn by the word his own fee bought — never before it.
      - name: a real claim settles
        run: npm run round-trip:brokers

      - name: every SDK symbol
        run: npm run spike

      # The D0 spikes. docs.md §7.3 quotes their pass counts, their block
      # numbers and the 90% forfeit as the evidence for the whole design, so
      # they are re-measured rather than trusted — a number in a document that
      # nothing re-runs is a number that goes quietly wrong.
      - name: the D0 spikes still measure what §7.3 says they measured
        run: |
          npm run spike:multidraw
          npm run spike:maxpayout
          npm run spike:coinflip

  # The header contract is the trap that silently costs the gallery preview, so
  # the live origin is re-read after every push to main.
  live-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify]
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_ORIGIN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: re-read the live origin
        run: |
          npm run gates -- --headers-only --origin "${{ vars.PRODUCTION_ORIGIN }}"
          node scripts/iframe-check.mjs "${{ vars.PRODUCTION_ORIGIN }}"
